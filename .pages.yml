media:
  folder: imagens/uploads

content:
  - name: produtos
    label: Produtos
    type: collection
    folder: content/produtos
    fields:
      - name: title
        label: Nome do Suplemento
        type: string
        required: true
      - name: image
        label: Imagem
        type: image
        required: true
      - name: detalhes
        label: Detalhes (Ex: 900g, 60 cápsulas, 30ml)
        type: string
        required: true
      - name: categorias
        label: Categorias
        type: select
        multiple: true
        options:
          - Bloqueador de Carboidrato
          - Ganho de Massa
          - Indutor do Sono
          - Multivitamínico
          - Pré Treino
          - Precursor Hormonal
          - Proteína
          - Termogênico
      - name: body
        label: Descrição
        type: rich-text
        required: true
