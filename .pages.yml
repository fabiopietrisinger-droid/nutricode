media:
  input: "imagens/uploads"
  output: "/imagens/uploads"

content:
  - name: "produtos"
    label: "Produtos (NutriCode)"
    type: "collection"
    path: "content/produtos"
    fields:
      - name: "title"
        label: "Nome do Suplemento"
        type: "string"
      - name: "ativo"
        label: "Produto Ativo no Site?"
        type: "boolean"
        default: true
      - name: "detalhes"
        label: "Detalhes (Ex: 900g, 60 cápsulas, 30ml)"
        type: "string"
      - name: "categorias"
        label: "Categorias"
        type: "select"
        list: true
        options:
          values:
            - "bloqueador-de-carboidrato"
            - "ganho-de-massa"
            - "indutor-do-sono"
            - "multivitaminico"
            - "pre-treino"
            - "precursor-hormonal"
            - "proteina"
            - "termogenico"
      - name: "image"
        label: "Imagem Principal"
        type: "image"
      - name: "galeria"
        label: "Galeria de Fotos"
        type: "object"
        list: true
        fields:
          - name: "foto"
            label: "Foto"
            type: "image"
      - name: "body"
        label: "Descrição de Vendas (Copy)"
        type: "rich-text"
